<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Snap</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <!--
      The capture toolbar, like macOS's ⌘⇧5, over a still of the display: snap the
      entire screen, one window, or a box you move and resize. Options picks where
      the snap goes (the meeting, or out of one a space you pick next; the clipboard) and a
      timer. Esc closes it.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: #000;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: #fff;
      }
      body.screen,
      body.window {
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='24' viewBox='0 0 28 24'><path d='M9 4l1.6-2h6.8L19 4h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z' fill='%23fff' stroke='%23000' stroke-width='1.4'/><circle cx='14' cy='13' r='4.6' fill='none' stroke='%23000' stroke-width='1.6'/></svg>")
            14 12,
          pointer;
      }
      body.portion {
        cursor: crosshair;
      }
      #shot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      #box {
        position: fixed;
        display: none;
        outline: 1px solid rgb(255 255 255 / 0.95);
        box-shadow: 0 0 0 9999px rgb(0 0 0 / 0.42);
        cursor: move;
      }
      #box .h {
        position: absolute;
        width: 9px;
        height: 9px;
        margin: -5.5px 0 0 -5.5px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.35);
        pointer-events: none;
      }
      /* Every edge of the box resizes it, not just the dots (edgeAt below). */
      body.portion:is([data-edge="nw"], [data-edge="se"]),
      body.portion:is([data-edge="nw"], [data-edge="se"]) #box {
        cursor: nwse-resize;
      }
      body.portion:is([data-edge="ne"], [data-edge="sw"]),
      body.portion:is([data-edge="ne"], [data-edge="sw"]) #box {
        cursor: nesw-resize;
      }
      body.portion:is([data-edge="n"], [data-edge="s"]),
      body.portion:is([data-edge="n"], [data-edge="s"]) #box {
        cursor: ns-resize;
      }
      body.portion:is([data-edge="e"], [data-edge="w"]),
      body.portion:is([data-edge="e"], [data-edge="w"]) #box {
        cursor: ew-resize;
      }
      #size {
        position: fixed;
        display: none;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgb(0 0 0 / 0.72);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #win {
        position: fixed;
        display: none;
        background: rgb(90 150 255 / 0.3);
        outline: 2px solid rgb(90 150 255 / 0.9);
        outline-offset: -2px;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgb(28 28 30 / 0.86);
        white-space: nowrap;
        pointer-events: none;
      }
      #bar {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px;
        border-radius: 13px;
        background: rgb(32 32 34 / 0.94);
        box-shadow:
          0 12px 32px rgb(0 0 0 / 0.45),
          inset 0 0 0 0.5px rgb(255 255 255 / 0.18);
        cursor: default;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: default;
      }
      .tb {
        width: 42px;
        height: 34px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: none;
        color: rgb(255 255 255 / 0.82);
      }
      .tb:hover {
        background: rgb(255 255 255 / 0.1);
      }
      .tb.on {
        background: rgb(255 255 255 / 0.2);
        color: #fff;
      }
      .tb svg {
        width: 22px;
        height: 22px;
      }
      .sep {
        width: 1px;
        height: 22px;
        margin: 0 6px;
        background: rgb(255 255 255 / 0.2);
      }
      #opts {
        width: auto;
        display: flex;
        gap: 5px;
        padding: 0 10px;
      }
      #opts svg {
        width: 10px;
        height: 10px;
      }
      :root {
        /* The Mac's accent color, when the app sends it. */
        --accent: #0a84ff;
      }
      #go {
        height: 30px;
        margin-left: 4px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent, #fff);
        font-weight: 500;
      }
      #go:hover {
        filter: brightness(1.12);
      }
      #go[hidden] {
        display: none;
      }
      #menu {
        position: fixed;
        display: none;
        min-width: 232px;
        padding: 5px;
        border-radius: 10px;
        background: rgb(44 44 46 / 0.98);
        box-shadow:
          0 12px 32px rgb(0 0 0 / 0.5),
          inset 0 0 0 0.5px rgb(255 255 255 / 0.18);
        cursor: default;
      }
      #menu .head {
        padding: 7px 10px 3px;
        color: rgb(255 255 255 / 0.5);
        font-size: 11.5px;
        font-weight: 600;
      }
      #menu .item {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 4px 10px 4px 6px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
      }
      #menu .item:is(:hover, :focus-visible):not(:disabled) {
        background: var(--accent);
        color: var(--on-accent, #fff);
        outline: none;
      }
      #menu .item:disabled {
        color: rgb(255 255 255 / 0.4);
      }
      #menu .check {
        width: 16px;
        text-align: center;
      }
      #menu .note {
        padding: 0 10px 5px 28px;
        color: rgb(255 255 255 / 0.5);
        font-size: 11.5px;
      }
      /* Increase Contrast in System Settings: solid panels and firmer edges. */
      @media (prefers-contrast: more) {
        #bar,
        #menu,
        #hint {
          background: #1c1c1e;
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.6);
        }
        .tb.on {
          box-shadow: inset 0 0 0 1px #fff;
        }
      }
      #menu hr {
        margin: 5px 6px;
        border: 0;
        border-top: 1px solid rgb(255 255 255 / 0.14);
      }
    </style>
  </head>
  <body class="portion">
    <img id="shot" alt="" draggable="false" />
    <div id="win"></div>
    <div id="box">
      <i class="h" style="left: 0; top: 0"></i><i class="h" style="left: 50%; top: 0"></i
      ><i class="h" style="left: 100%; top: 0"></i><i class="h" style="left: 100%; top: 50%"></i
      ><i class="h" style="left: 100%; top: 100%"></i><i class="h" style="left: 50%; top: 100%"></i
      ><i class="h" style="left: 0; top: 100%"></i><i class="h" style="left: 0; top: 50%"></i>
    </div>
    <div id="size"></div>
    <div id="hint"></div>
    <div id="bar">
      <button class="tb" id="close" title="Close (Esc)">
        <svg viewBox="0 0 22 22">
          <circle cx="11" cy="11" r="8.5" fill="currentColor" opacity="0.22" />
          <path d="M8 8l6 6M14 8l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
      <span class="sep"></span>
      <button class="tb" data-mode="screen" title="Capture Entire Screen" aria-pressed="false">
        <svg viewBox="0 0 22 22"><rect x="2.5" y="4.5" width="17" height="13" rx="2" fill="currentColor" /></svg>
      </button>
      <button class="tb" data-mode="window" title="Capture Selected Window" aria-pressed="false">
        <svg viewBox="0 0 22 22">
          <rect x="2.5" y="4.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="5.5" y="7.5" width="11" height="7" rx="1" fill="currentColor" />
        </svg>
      </button>
      <button class="tb" data-mode="portion" title="Capture Selected Portion" aria-pressed="false">
        <svg viewBox="0 0 22 22">
          <rect x="2.5" y="4.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.4 2" />
          <rect x="7" y="8.5" width="8" height="5" rx="0.8" fill="currentColor" />
        </svg>
      </button>
      <span class="sep"></span>
      <button class="tb" id="opts" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
        Options
        <svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
      </button>
      <button id="go">Capture</button>
    </div>
    <div id="menu" role="menu" aria-label="Options"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const MIN = 8;
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      /** {prefs, inMeeting, space, windows: [{id, x, y, w, h}] front to back, in this page's pixels}.
       *  The windows come a moment after the rest; space is the bar's, out of a meeting. */
      let st = null;
      let mode = "portion";
      let box = { x: 0, y: 0, w: 0, h: 0 };
      let hover = null;
      let drag = null;
      let pointer = null;

      window.snap.onOpen((o) => {
        st = o;
        if (o.accent) {
          document.documentElement.style.setProperty("--accent", o.accent);
          // White on a light accent (yellow, green, graphite) is hard to read: black there instead.
          const [r, g, b] = [1, 3, 5].map((i) => parseInt(o.accent.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
          const light = 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.3;
          document.documentElement.style.setProperty("--on-accent", light ? "#000" : "#fff");
        }
        mode = o.prefs.mode;
        const b = o.prefs.box;
        box = b
          ? { x: b.x * innerWidth, y: b.y * innerHeight, w: b.w * innerWidth, h: b.h * innerHeight }
          : { x: innerWidth * 0.25, y: innerHeight * 0.22, w: innerWidth * 0.5, h: innerHeight * 0.5 };
        fit();
        $("shot").src = o.image;
        render();
      });
      window.snap.onWindows((list) => {
        if (!st) return;
        st.windows = list;
        if (mode === "window" && pointer) {
          hover = windowAt(pointer.x, pointer.y);
          render();
        }
      });
      $("shot").onload = () => window.snap.ready();
      $("shot").onerror = () => window.snap.done({ failed: "The picture of your screen didn't load." });

      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      function fit() {
        box.w = clamp(box.w, MIN, innerWidth);
        box.h = clamp(box.h, MIN, innerHeight);
        box.x = clamp(box.x, 0, innerWidth - box.w);
        box.y = clamp(box.y, 0, innerHeight - box.h);
      }
      const prefsNow = () => ({
        ...st.prefs,
        mode,
        box: { x: box.x / innerWidth, y: box.y / innerHeight, w: box.w / innerWidth, h: box.h / innerHeight },
      });
      function capture() {
        if (!st || (mode === "window" && !hover)) return;
        window.snap.done({
          mode,
          rect: mode === "portion" ? box : mode === "window" ? hover : null,
          windowId: mode === "window" ? hover.id : null,
          size: [innerWidth, innerHeight],
          prefs: prefsNow(),
        });
      }
      const cancel = () => window.snap.done({ cancel: true, prefs: st ? prefsNow() : null });

      const HINTS = {
        screen: "Click anywhere to snap the whole screen",
        window: "Click a window to snap it",
        portion: "Drag to move or resize · Enter to snap",
      };
      function render() {
        if (!st) return;
        document.body.className = mode;
        for (const b of document.querySelectorAll("[data-mode]")) {
          b.classList.toggle("on", b.dataset.mode === mode);
          b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
        }
        $("go").hidden = mode === "window";
        $("hint").textContent = HINTS[mode];
        const showBox = mode === "portion";
        Object.assign($("box").style, { display: showBox ? "block" : "none", left: box.x + "px", top: box.y + "px", width: box.w + "px", height: box.h + "px" });
        const s = $("size");
        s.style.display = showBox ? "block" : "none";
        s.textContent = `${Math.round(box.w * devicePixelRatio)} × ${Math.round(box.h * devicePixelRatio)}`;
        const below = box.y + box.h + 38 < innerHeight;
        Object.assign(s.style, { left: box.x + box.w / 2 - s.offsetWidth / 2 + "px", top: (below ? box.y + box.h + 8 : box.y + 8) + "px" });
        const w = $("win");
        w.style.display = mode === "window" && hover ? "block" : "none";
        if (hover) Object.assign(w.style, { left: hover.x + "px", top: hover.y + "px", width: hover.w + "px", height: hover.h + "px" });
      }

      // ---- the Options menu ----
      function renderMenu() {
        const p = st.prefs;
        const kept = document.activeElement?.dataset?.act;
        const row = (label, on, act, role, disabled = false) =>
          `<button class="item" role="${role}" aria-checked="${on}" tabindex="-1" data-act="${act}"${disabled ? " disabled" : ""}><span class="check" aria-hidden="true">${on ? "✓" : ""}</span>${label}</button>`;
        $("menu").innerHTML =
          `<div role="group" aria-label="Save to"><div class="head" aria-hidden="true">Save to</div>` +
          row(st.inMeeting ? "The meeting, on the item in focus" : st.space ? `A note for ${esc(st.space)}` : "A note for the space", p.toMeeting, "meeting", "menuitemcheckbox") +
          row("Clipboard", p.toClipboard, "clipboard", "menuitemcheckbox") +
          `</div><hr /><div role="group" aria-label="Timer"><div class="head" aria-hidden="true">Timer</div>` +
          row("None", !p.timer, "t0", "menuitemradio") +
          row("5 Seconds", p.timer === 5, "t5", "menuitemradio") +
          row("10 Seconds", p.timer === 10, "t10", "menuitemradio") +
          `</div>`;
        if (kept) $("menu").querySelector(`[data-act="${kept}"]`)?.focus();
      }
      const menuItems = () => [...$("menu").querySelectorAll(".item:not(:disabled)")];
      function openMenu(withKeys) {
        renderMenu();
        const m = $("menu");
        m.style.display = "block";
        $("opts").setAttribute("aria-expanded", "true");
        const r = $("opts").getBoundingClientRect();
        Object.assign(m.style, { left: r.left + "px", top: r.top - m.offsetHeight - 10 + "px" });
        // Opened from the keyboard, the first item takes focus, as in a Mac menu.
        if (withKeys) menuItems()[0]?.focus();
      }
      function closeMenu() {
        $("menu").style.display = "none";
        $("opts").setAttribute("aria-expanded", "false");
      }
      const menuOpen = () => $("menu").style.display === "block";
      $("opts").onclick = (e) => (menuOpen() ? closeMenu() : openMenu(e.detail === 0));
      $("menu").onclick = (e) => {
        const act = e.target.closest("[data-act]")?.dataset.act;
        if (!act) return;
        const p = st.prefs;
        // One of the two places always stays on.
        if (act === "meeting" && (p.toClipboard || !p.toMeeting)) p.toMeeting = !p.toMeeting;
        if (act === "clipboard" && (p.toMeeting || !p.toClipboard)) p.toClipboard = !p.toClipboard;
        if (act.startsWith("t")) {
          p.timer = Number(act.slice(1));
          return closeMenu();
        }
        renderMenu();
      };

      // ---- the toolbar ----
      for (const b of document.querySelectorAll("[data-mode]"))
        b.onclick = () => {
          mode = b.dataset.mode;
          hover = null;
          closeMenu();
          render();
        };
      $("close").onclick = cancel;
      $("go").onclick = capture;
      /** Esc closes the innermost thing: Options if it's open, else the toolbar. */
      function escape() {
        if (!menuOpen()) return cancel();
        closeMenu();
        $("opts").focus();
        window.snap.kept();
      }
      window.snap.onEscape(escape);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") return escape();
        if (menuOpen()) {
          // Up and down walk the menu, as in a Mac menu.
          const items = menuItems();
          const at = items.indexOf(document.activeElement);
          const go = { ArrowDown: at + 1, ArrowUp: at < 0 ? items.length - 1 : at - 1, Home: 0, End: items.length - 1 }[e.key];
          if (go !== undefined && items.length) {
            e.preventDefault();
            items[(go + items.length) % items.length].focus();
          }
          return;
        }
        // Enter on a toolbar button presses it; elsewhere it snaps.
        if (e.key === "Enter" && !e.target.closest?.("button")) capture();
        // The arrow keys nudge the box, by 10 points with Shift.
        const step = e.shiftKey ? 10 : 1;
        const nudge = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        if (nudge && st && mode === "portion") {
          e.preventDefault();
          box = { ...box, x: box.x + nudge[0], y: box.y + nudge[1] };
          fit();
          render();
        }
      });

      // ---- the screen ----
      const windowAt = (x, y) => st.windows.find((w) => x >= w.x && x < w.x + w.w && y >= w.y && y < w.y + w.h) ?? null;
      const inBox = (x, y) => x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h;
      // Which edge or corner of the box is under the pointer ("n", "se", ...), or "". An edge
      // can be grabbed anywhere along it, a few pixels either side, and corners from a little
      // further along. Inside a small box, the middle stays free for moving it.
      const GRAB = 8;
      const CORNER = 18;
      function edgeAt(x, y) {
        if (mode !== "portion" || !box.w) return "";
        const [l, t, r, b] = [box.x, box.y, box.x + box.w, box.y + box.h];
        const inX = Math.min(GRAB, box.w / 4);
        const inY = Math.min(GRAB, box.h / 4);
        if (x <= l - GRAB || x >= r + GRAB || y <= t - GRAB || y >= b + GRAB) return "";
        let v = y < t + inY ? "n" : y > b - inY ? "s" : "";
        let h = x < l + inX ? "w" : x > r - inX ? "e" : "";
        const cornerX = Math.min(CORNER, box.w / 4);
        const cornerY = Math.min(CORNER, box.h / 4);
        if (v && !h) h = x < l + cornerX ? "w" : x > r - cornerX ? "e" : "";
        if (h && !v) v = y < t + cornerY ? "n" : y > b - cornerY ? "s" : "";
        return v + h;
      }
      const showEdge = (x, y) => (document.body.dataset.edge = edgeAt(x, y));
      addEventListener("mousedown", (e) => {
        if (!st || e.button !== 0 || e.target.closest("#bar, #menu")) return;
        if (menuOpen()) return closeMenu();
        if (mode === "screen") return capture();
        if (mode === "window") {
          hover = windowAt(e.clientX, e.clientY);
          return capture();
        }
        const edge = showEdge(e.clientX, e.clientY);
        drag = { kind: edge || (inBox(e.clientX, e.clientY) ? "move" : "new"), x: e.clientX, y: e.clientY, from: { ...box } };
      });
      addEventListener("mousemove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        if (!st) return;
        if (mode === "window") {
          const w = e.target.closest("#bar, #menu") ? null : windowAt(e.clientX, e.clientY);
          if (w !== hover) {
            hover = w;
            render();
          }
          return;
        }
        if (!drag) return void showEdge(e.clientX, e.clientY);
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        const f = drag.from;
        // Shift keeps to one direction, as with ⌘⇧4.
        const lock = e.shiftKey && (drag.kind === "move" || drag.kind.length === 2);
        const [mx, my] = lock ? (Math.abs(dx) >= Math.abs(dy) ? [dx, 0] : [0, dy]) : [dx, dy];
        if (drag.kind === "move") box = { ...f, x: f.x + mx, y: f.y + my };
        else if (drag.kind === "new") {
          // A click outside the box keeps it; a drag draws a new one.
          if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
          box = { x: Math.min(drag.x, e.clientX), y: Math.min(drag.y, e.clientY), w: Math.abs(dx), h: Math.abs(dy) };
        } else {
          let [l, t, r, b] = [f.x, f.y, f.x + f.w, f.y + f.h];
          // Option resizes from the middle: the opposite edge moves the other way.
          const mid = e.altKey;
          if (drag.kind.includes("w")) [l, r] = [l + mx, mid ? r - mx : r];
          if (drag.kind.includes("e")) [l, r] = [mid ? l - mx : l, r + mx];
          if (drag.kind.includes("n")) [t, b] = [t + my, mid ? b - my : b];
          if (drag.kind.includes("s")) [t, b] = [mid ? t - my : t, b + my];
          // An edge stops short of the opposite one (or the middle), and at the screen's edge.
          if (r - l < MIN) {
            const c = f.x + f.w / 2;
            [l, r] = mid ? [c - MIN / 2, c + MIN / 2] : drag.kind.includes("w") ? [r - MIN, r] : [l, l + MIN];
          }
          if (b - t < MIN) {
            const c = f.y + f.h / 2;
            [t, b] = mid ? [c - MIN / 2, c + MIN / 2] : drag.kind.includes("n") ? [b - MIN, b] : [t, t + MIN];
          }
          [l, t, r, b] = [Math.max(l, 0), Math.max(t, 0), Math.min(r, innerWidth), Math.min(b, innerHeight)];
          box = { x: l, y: t, w: r - l, h: b - t };
        }
        fit();
        render();
      });
      addEventListener("mouseup", (e) => {
        drag = null;
        showEdge(e.clientX, e.clientY);
      });
      // Dragging is ours: no picking up the still as an image.
      addEventListener("dragstart", (e) => e.preventDefault());
      addEventListener("dblclick", (e) => mode === "portion" && inBox(e.clientX, e.clientY) && capture());
    </script>
  </body>
</html>
