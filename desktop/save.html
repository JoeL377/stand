<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save snap</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <!--
      Out of a meeting, after the snap is cut: where it goes before anything leaves the Mac.
      The space (the last one used), the item (or Stand picks one, marked ✦ until someone
      confirms it) and an optional line. Enter saves, Esc cancels. It stays up while it saves,
      then shows a check and goes.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: #e8e8ee;
        user-select: none;
        cursor: default;
      }
      :root {
        --accent: #0a84ff;
      }
      /* Held to the bottom of its window, so a problem line grows it upward. */
      #card {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border-radius: 14px;
        background: rgb(24 25 30 / 0.97);
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 0.14),
          0 8px 24px rgb(0 0 0 / 0.4);
      }
      @media (prefers-reduced-motion: no-preference) {
        #card {
          animation: in 0.18s cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        @keyframes in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
        }
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      #thumb {
        flex: none;
        width: 64px;
        height: 40px;
        border-radius: 6px;
        object-fit: cover;
        background: #000;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12);
      }
      .pills {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 6px;
      }
      select {
        appearance: none;
        min-width: 0;
        max-width: 50%;
        height: 26px;
        padding: 0 22px 0 10px;
        border: 0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1)
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5l3 3 3-3' fill='none' stroke='%23c8c8d0' stroke-width='1.5'/></svg>")
          no-repeat right 8px center;
        color: #fff;
        font: inherit;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        outline: none;
      }
      select:hover {
        background-color: rgb(255 255 255 / 0.16);
      }
      select:focus-visible,
      input:focus-visible,
      button:focus-visible {
        box-shadow: 0 0 0 2px var(--accent);
      }
      #item.agent {
        color: #b9cffb;
      }
      #close {
        flex: none;
        align-self: flex-start;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgb(255 255 255 / 0.1);
        color: #c8c8d0;
        font: 12px/22px -apple-system, system-ui;
        outline: none;
      }
      #close:hover {
        background: rgb(255 255 255 / 0.18);
        color: #fff;
      }
      input {
        flex: 1;
        min-width: 0;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.08);
        color: #fff;
        font: inherit;
        outline: none;
        user-select: text;
      }
      input::placeholder {
        color: rgb(255 255 255 / 0.45);
      }
      #go {
        flex: none;
        height: 30px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent, #fff);
        font: inherit;
        font-weight: 600;
        outline: none;
      }
      #go:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      #go:disabled {
        opacity: 0.6;
      }
      #why {
        margin: -2px 2px 0;
        color: #ff9a8f;
        font-size: 12px;
        line-height: 1.35;
      }
      #done {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        font-size: 13px;
      }
      #done strong {
        display: block;
        font-size: 13.5px;
      }
      #done span {
        color: #a5a5b3;
      }
      .check {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #30d158;
        color: #06290f;
        font-weight: 700;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-contrast: more) {
        #card {
          background: #1c1c1e;
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="card" role="dialog" aria-label="Save the snap to a space">
      <div id="form">
        <div class="row">
          <img id="thumb" alt="The snap" />
          <div class="pills">
            <select id="space" aria-label="Space"></select>
            <select id="item" aria-label="Item"></select>
          </div>
          <button id="close" title="Don't save (Esc)" aria-label="Don't save">✕</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <input id="line" maxlength="300" placeholder="Add a line about it (optional)" aria-label="A line about it" />
          <button id="go" title="Save (Enter)">Save</button>
        </div>
        <div id="why" role="alert" hidden></div>
      </div>
      <div id="done" role="status" hidden>
        <span class="check" aria-hidden="true">✓</span>
        <div><strong id="done-title"></strong><span id="done-body"></span></div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      let st = null;
      let saving = false;
      const SUGGEST = "✦ Stand picks";

      function fillItems(items) {
        const sel = $("item");
        sel.innerHTML = "";
        const add = (value, text, disabled = false) => {
          const o = document.createElement("option");
          o.value = value;
          o.textContent = text;
          o.disabled = disabled;
          sel.append(o);
        };
        add("", SUGGEST);
        if (!items) add("-", "Loading the items…", true);
        else for (const it of items) add(it.id, it.title);
        sel.value = "";
        mark();
      }
      const mark = () => $("item").classList.toggle("agent", !$("item").value);

      window.save.onOpen((o) => {
        st = o;
        if (o.accent) document.documentElement.style.setProperty("--accent", o.accent);
        if (o.onAccent) document.documentElement.style.setProperty("--on-accent", o.onAccent);
        $("thumb").src = o.thumb;
        const sel = $("space");
        for (const s of o.spaces) {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.textContent = s.name;
          sel.append(opt);
        }
        sel.value = o.space;
        fillItems(o.items);
        $("line").focus();
        requestAnimationFrame(() => window.save.ready());
      });

      window.save.onItems((o) => o.space === $("space").value && fillItems(o.items));
      $("space").onchange = async () => {
        const id = $("space").value;
        fillItems(null);
        const items = await window.save.items(id).catch(() => []);
        if ($("space").value === id) fillItems(items);
      };
      $("item").onchange = mark;

      function go() {
        if (!st || saving) return;
        saving = true;
        $("go").disabled = true;
        $("go").textContent = "Saving…";
        $("why").hidden = true;
        const item = $("item").selectedOptions[0];
        window.save.go({ spaceId: $("space").value, itemId: item?.value || null, itemTitle: item?.value ? item.textContent : null, line: $("line").value.trim() });
      }
      $("go").onclick = go;
      $("close").onclick = () => window.save.cancel();
      window.save.onEscape(() => window.save.cancel());
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") return window.save.cancel();
        if (e.key === "Enter" && !e.target.closest("select, button")) go();
      });

      window.save.onResult((r) => {
        saving = false;
        if (r.ok) {
          $("form").hidden = true;
          $("done-title").textContent = `Saved to ${r.space}`;
          $("done-body").textContent = r.item ?? "Stand will suggest the item it's about";
          $("done").hidden = false;
          return;
        }
        $("go").disabled = false;
        $("go").textContent = "Try again";
        $("why").textContent = r.why;
        $("why").hidden = false;
      });
    </script>
  </body>
