<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Stand bar</title>
<style>
  :root { color-scheme: dark; font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  /* Stand blue around the edge, so the bar stands out over dark apps as well as light ones. */
  :root {
    --ring: 0 0 0 1.5px rgb(96 150 255 / 0.9), 0 0 0 4px rgb(45 108 223 / 0.28), 0 2px 4px rgb(0 0 0 / 0.35);
    --ring-lit: 0 0 0 1.5px rgb(150 190 255), 0 0 0 4px rgb(45 108 223 / 0.7), 0 2px 4px rgb(0 0 0 / 0.35);
  }
  /* The pill drags the bar around; its buttons stay clickable. */
  .pill { position: absolute; top: 4px; left: 4px; right: 4px; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 5px; border-radius: 20px; background: rgb(24 25 30 / 0.97); box-shadow: var(--ring); color: #e8e8ee; -webkit-app-region: drag; transition: border-radius 0.14s cubic-bezier(0.23, 1, 0.32, 1); }
  /* The note card hangs from the bar's lower edge (upper, when the bar is low on the screen) as
     one piece: that edge goes square and its ring stops there, where the card's carries on. */
  body.noting .pill { border-radius: 18px 18px 0 0; clip-path: inset(-8px -8px 0 -8px); }
  body.noting.noting-up .pill { border-radius: 0 0 18px 18px; clip-path: inset(0 -8px -8px -8px); }
  @media (prefers-reduced-motion: reduce) { .pill { transition: none; } }
  /* While you talk the ring brightens with your voice (--v, 0 to 1), and settles when you stop. */
  .pill.voice {
    box-shadow:
      0 0 0 calc(1.5px + var(--v) * 0.5px) color-mix(in srgb, rgb(170 205 255) calc(var(--v) * 100%), rgb(96 150 255 / 0.9)),
      0 0 0 4px rgb(45 108 223 / calc(0.28 + var(--v) * 0.5)),
      0 2px 4px rgb(0 0 0 / 0.35);
    transition: box-shadow 0.12s linear;
  }
  /* Talking while muted: amber, and the title says so. */
  .pill.muted-talk { box-shadow: 0 0 0 1.5px rgb(251 191 36), 0 0 0 4px rgb(245 158 11 / 0.4), 0 2px 4px rgb(0 0 0 / 0.35); }
  .pill.muted-talk .mic { background: rgb(245 158 11 / 0.22); color: #fbbf24; }
  /* The bar settles in quickly whenever it comes up, and glows once when a meeting starts. */
  @keyframes arrive { from { transform: scale(0.96); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes glow { 50% { box-shadow: var(--ring-lit); } }
  .pill.waiting { opacity: 0; }
  .pill.arrive { animation: arrive 180ms cubic-bezier(0.23, 1, 0.32, 1); }
  .pill.arrive.first { animation: arrive 180ms cubic-bezier(0.23, 1, 0.32, 1), glow 800ms ease-in-out 180ms 1; }
  @media (prefers-reduced-motion: reduce) {
    .pill.arrive { animation: fade 150ms ease-out; }
    .pill.arrive.first { animation: fade 150ms ease-out, glow 800ms ease-in-out 1; }
  }
  /* Pressed: a little give, answering before the click completes. */
  button { transition: background 0.12s, scale 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  button.down { scale: 0.97; }
  @media (prefers-reduced-motion: reduce) { button.down { scale: none; filter: brightness(0.85); } }
  button { -webkit-app-region: no-drag; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; height: 30px; padding: 0; border: 0; border-radius: 999px; background: none; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: rgb(255 255 255 / 0.1); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .open { width: 30px; }
  .open svg { width: 22px; height: 22px; stroke: none; }
  .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d7d7e0; font-size: 12.5px; }
  .what .key { margin-right: 6px; padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2); color: #a5a5b3; font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .what.said { display: flex; align-items: center; color: #86efac; }
  .what .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .what.said.bad, .what.warn { color: #fcd34d; }
  /* Still going: neither good nor bad yet. */
  .what.said.pending { color: #d7d7e0; }
  .mic { width: 30px; }
  .mic.off { color: #ff7b7b; }
  /* Out of a meeting: the space the bar holds, and a way to start talking there. */
  .space { flex: none; min-width: 0; max-width: 130px; margin-right: auto; padding: 0 8px 0 10px; gap: 6px; background: rgb(255 255 255 / 0.08); color: #e8e8ee; font-size: 12.5px; font-weight: 500; }
  .space:hover { background: rgb(255 255 255 / 0.14); }
  .space .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .space svg { flex: none; width: 10px; height: 10px; color: #a5a5b3; }
  .space .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  .mic.live { color: #34d399; }
  /* Looks like a field; a click opens the note card under the bar, where the typing happens. */
  .note { flex: 1; min-width: 0; justify-content: flex-start; gap: 6px; padding: 0 10px; border-radius: 8px; background: rgb(255 255 255 / 0.05); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08); color: rgb(255 255 255 / 0.5); font-size: 12.5px; }
  .note:hover { background: rgb(255 255 255 / 0.09); color: rgb(255 255 255 / 0.7); }
  .note svg { flex: none; width: 13px; height: 13px; }
  .note span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note.pinned { color: rgb(255 255 255 / 0.8); }
  /* With the card open the typing is down there, so the field steps aside. */
  body.noting .note { display: none; }
  /* Out of a meeting Snap is just its camera, so the note field has the room. */
  body.rest:not(.call) .snap { width: 30px; padding: 0; }
  body.rest:not(.call) .snap .label { display: none; }
  /* In a call in a browser: the bar is the meeting's, with a dot for the call. */
  .what .live { display: inline-block; width: 7px; height: 7px; margin: 0 7px 1px 2px; border-radius: 50%; background: #34d399; }
  .snap { padding: 0 12px 0 10px; background: #2d6cdf; color: #fff; font-size: 12.5px; font-weight: 500; }
  .snap:hover { background: #3d7cf0; }
  .todos { padding: 0 8px; gap: 4px; color: #a5a5b3; font-size: 12px; font-variant-numeric: tabular-nums; }
  .todos svg { width: 14px; height: 14px; }
  .todos.on { background: rgb(255 255 255 / 0.12); color: #e8e8ee; }
  /* The space's to-dos, under the bar (over it when the bar is low on the screen). Click one
     to copy it. */
  .list { position: absolute; top: 50px; left: 4px; right: 4px; padding: 4px; border-radius: 12px; background: rgb(24 25 30 / 0.97); box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12), 0 2px 4px rgb(0 0 0 / 0.35); }
  body.up .pill { top: auto; bottom: 4px; }
  body.up .list { top: auto; bottom: 50px; }
  .list-head { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px 6px; color: #8e8e9c; font-size: 11px; }
  .list-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9c9d3; font-weight: 600; }
  .rows { max-height: 240px; margin: 0; padding: 0; overflow-y: auto; list-style: none; }
  .todo { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; cursor: pointer; }
  .todo:is(:hover, :focus-within) { background: rgb(255 255 255 / 0.08); }
  .todo .copy { flex: 1; min-width: 0; height: 100%; margin: 0 -4px; padding: 0 4px; gap: 8px; justify-content: flex-start; border-radius: 0; background: none; text-align: left; }
  .todo .copy:focus-visible, .todo .plain:focus-visible { outline: 2px solid #8fb2ff; outline-offset: -2px; border-radius: 6px; }
  .todo .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e3e3ea; font-size: 12.5px; }
  .todo .meta { flex: none; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8e8e9c; font-size: 11px; }
  .todo .plain { flex: none; height: 22px; padding: 2px 6px; border-radius: 5px; color: #a5a5b3; font-size: 11px; }
  /* Out of sight until the row is hovered or focused, but still there for VoiceOver. */
  .todo:not(:hover, :focus-within) .plain { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
  .todo .plain:hover { background: rgb(255 255 255 / 0.12); color: #fff; }
  .todo:is(:hover, :focus-within) .meta { display: none; }
  .todo.copied .meta, .todo.copied:is(:hover, :focus-within) .meta { display: inline; color: #86efac; }
  .todo.copied:not(:focus-within) .plain { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
  .what .fix { height: 22px; margin-left: 8px; padding: 0 9px; background: rgb(255 255 255 / 0.14); color: #fff; font-size: 12px; }
  /* Something the person should know, ahead of the item: red for not recording, amber for the connection. */
  .what .flag { margin-right: 6px; color: #fcd34d; font-weight: 500; }
  .what .flag.bad { color: #ff8a8a; }
  .what.nudge { display: flex; align-items: center; color: #c9d7ff; }
  .what.nudge .go { min-width: 0; max-width: 100%; margin-left: 0; gap: 5px; justify-content: flex-start; }
  .what.nudge .mark { color: #8fb2ff; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  /* Increase Contrast in System Settings: a firmer edge, no glow. */
  @media (prefers-contrast: more) {
    :root { --ring: 0 0 0 2px #fff; --ring-lit: 0 0 0 2px #fff; }
    .pill { background: #111214; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <button class="open" id="open" title="Open Stand" aria-label="Open Stand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2d6cdf" /><path d="M9 20v-8M14 23V9M19 19v-6M24 17v-2" stroke="white" stroke-width="3" stroke-linecap="round" /></svg>
    </button>
    <button class="space" id="space" aria-haspopup="menu" hidden>
      <span class="dot" id="space-live" hidden></span>
      <span class="name" id="space-name"></span>
      <svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" /></svg>
    </button>
    <button class="note" id="note" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z" /><path d="m13.5 6.5 4 4" /></svg>
      <span id="note-text">Write a note…</span>
    </button>
    <div class="what" id="what"></div>
    <button class="todos" id="todos" title="To-dos in this space: click one to copy it" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" /><path d="M8.5 12.5l2.5 2.5 4.5-5.5" /></svg>
      <span id="todo-count"></span>
    </button>
    <div class="sr" id="said" role="status"></div>
    <button class="mic" id="mic" aria-label="Mute">
      <svg id="mic-on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
      <svg id="mic-off" viewBox="0 0 24 24" hidden><path d="M15 9.5V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.6 2.5M5 11a7 7 0 0 0 11.3 5.5M19 11a7 7 0 0 1-.6 2.8M12 18v3M4 4l16 16" /></svg>
    </button>
    <button class="snap" id="snap" title="Snap the screen, a window or part of it, for everyone in the meeting (Control + Shift + S)">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" /><circle cx="12" cy="13" r="3.5" /></svg>
      <span class="label">Snap</span>
    </button>
  </div>
  <div class="list" id="list" hidden>
    <div class="list-head"><b id="list-space"></b><span>Click to copy for your agent</span></div>
    <ul class="rows" id="rows"></ul>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let state = null;
  /** The note card hanging from the bar, {above}, while it's open. */
  let noting = null;
  let saying = null;
  // Talking while muted (see "your voice" below).
  let mutedTalk = false;

  // VoiceOver doesn't follow text that changes in place, so changes worth knowing are read out.
  let spoken = "";
  function speak() {
    const s = state;
    const now = !s
      ? ""
      : s.ending
        ? "The meeting has ended. Stand is writing the notes."
        : mutedTalk
          ? "You're muted."
          : s.offline
          ? "Stand is reconnecting."
          : s.notRecording
            ? "Not recording. What you say isn't being recorded."
            : s.switched
              ? `Switched to ${s.switched}. Undo is on the bar.`
              : s.nudge
                ? `Stand suggests switching to ${s.nudge}.`
                : "";
    if (now === spoken) return;
    // Coming back after a problem is worth saying too.
    const wasTrouble = spoken.startsWith("Stand is reconnecting") || spoken.startsWith("Not recording");
    spoken = now;
    const say = now || (wasTrouble && s ? "Stand is connected and recording again." : "");
    // While a snap's result is being read out, this waits its turn.
    if (saying) owed = say;
    else if (say) $("said").textContent = say;
  }
  let owed = "";

  function render() {
    speak();
    const what = $("what");
    const rest = Boolean(state?.rest);
    // Out of a meeting the space and the note field take the middle, unless a snap's result is showing there.
    // In a call in a browser it's the meeting's bar, as in a call here: what's in focus, to-dos, Snap.
    const call = rest && Boolean(state.call);
    document.body.classList.toggle("rest", rest);
    document.body.classList.toggle("call", call);
    $("space").hidden = !rest || call || Boolean(saying);
    $("note").hidden = !rest || call || Boolean(saying) || Boolean(state?.none);
    what.hidden = rest && !call && !saying;
    if (rest) renderRest();
    // The mic first: it can be pressed while a snap's result shows, and has to show the change.
    else if (state) {
      $("mic").hidden = false;
      $("mic").className = state.micOn ? "mic" : "mic off";
      $("mic").ariaLabel = state.micOn ? "Mute" : "Unmute";
      $("mic").title = `${$("mic").ariaLabel}${state.muteKey ? ` (${state.muteKey.replace(/\+/g, " + ")}, from any app)` : ""}`;
      // SVGs have no .hidden property, so set the attribute.
      $("mic-on").toggleAttribute("hidden", !state.micOn);
      $("mic-off").toggleAttribute("hidden", state.micOn);
      // Once the meeting has ended there's nothing to snap into.
      $("snap").hidden = Boolean(state.ending);
      $("snap").title = "Snap the screen, a window or part of it, for everyone in the meeting (Control + Shift + S)";
      $("snap").removeAttribute("aria-label");
      const todos = state.todos ?? [];
      // For the few seconds the bar says where Switch went, the count steps aside so it fits.
      const switching = Boolean(state.switched && !state.offline && !state.notRecording);
      $("todos").hidden = todos.length === 0 || (switching && !listOpen);
      $("todo-count").textContent = todos.length;
      $("todos").ariaLabel = `${todos.length} to-do${todos.length === 1 ? "" : "s"} in this space`;
      if (listOpen) todos.length ? void showList(true) : void showList(false);
    }
    what.className = "what";
    what.textContent = "";
    what.title = "";
    $("pill").classList.toggle("muted-talk", Boolean(mutedTalk && !rest));
    if (saying) {
      what.className = saying.pending ? "what said pending" : saying.ok ? "what said" : "what said bad";
      const text = document.createElement("span");
      text.className = "t";
      text.textContent = saying.text;
      what.replaceChildren(text);
      what.title = saying.body ?? "";
      // A missing permission comes with the way to it.
      if (saying.settings) {
        const fix = document.createElement("button");
        fix.className = "fix";
        fix.textContent = "Open Settings";
        press(fix, "settings");
        what.append(fix);
      }
      return;
    }
    if (call) {
      const dot = document.createElement("span");
      dot.className = "live";
      what.append(dot, state.call.focus ?? state.space);
      what.title = `You're in the call in ${state.space}, in your browser. Snaps go into it, on the item in focus.`;
      return;
    }
    if (!state || rest) return;
    if (state.ending) {
      what.textContent = "Writing notes…";
      what.title = "The meeting has ended. Stand is writing the notes; the recap shows up in the space.";
      return;
    }
    // Talking while muted: said here, where you'd look, until a moment after you stop.
    if (mutedTalk) {
      what.className = "what warn";
      what.textContent = "You're muted";
      what.title = "Click the mic to unmute";
      return;
    }
    // Just switched from the bar: where to, and the way back, here where it was pressed.
    // A problem (reconnecting, not recording) still comes first.
    if (state.switched && !state.offline && !state.notRecording) {
      what.className = "what said";
      const text = document.createElement("span");
      text.className = "t";
      text.textContent = `✓ ${state.switched}`;
      const undo = document.createElement("button");
      undo.className = "fix";
      undo.textContent = "Undo";
      press(undo, "undo");
      what.replaceChildren(text, undo);
      what.title = `Switched to ${state.switched}`;
      return;
    }
    // The host's nudge, which otherwise only shows in the Stand window.
    // One button, so the item's name is what gets the room.
    // Not recording comes first for a nudge from the talk: it means little when nothing is heard.
    if (state.nudge && !state.offline && !(state.notRecording && state.nudgeFromTalk)) {
      what.className = "what nudge";
      const go = document.createElement("button");
      go.className = "fix go";
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = "✦";
      mark.ariaHidden = "true";
      const text = document.createElement("span");
      text.className = "t";
      // Beside "Not recording" there's room only for the item's name; it's still the Switch button.
      text.textContent = state.notRecording ? state.nudge : `Switch to ${state.nudge}`;
      go.ariaLabel = `Switch to ${state.nudge}`;
      go.append(mark, text);
      go.title = `The talk or the screen seems to be about ${state.nudge}. Switch the meeting to it.`;
      press(go, "switch");
      // Nothing being recorded still shows, in front.
      if (state.notRecording) {
        const f = document.createElement("span");
        f.className = "flag bad";
        f.textContent = "Not recording";
        what.append(f);
      }
      what.append(go);
      return;
    }
    const flag = state.offline ? ["Reconnecting…", ""] : state.notRecording ? ["Not recording", "bad"] : null;
    if (flag) {
      const f = document.createElement("span");
      f.className = `flag ${flag[1]}`;
      f.textContent = flag[0];
      what.append(f);
    }
    if (state.itemKey) {
      const key = document.createElement("span");
      key.className = "key";
      key.textContent = state.itemKey;
      what.append(key);
    }
    what.append(state.item ?? state.space);
    what.title = [
      state.offline && "Stand is reconnecting. Edits wait and go through when it's back.",
      state.notRecording && "What you say isn't being recorded. Open Stand to see why.",
      state.item ? `${state.space}: ${state.item}` : state.space,
    ]
      .filter(Boolean)
      .join(" ");
  }

  // Out of a meeting: the space, who's talking there, its to-dos, and Snap to it.
  function renderRest() {
    const s = state;
    const name = s.none ? "Make a space" : s.space;
    $("space-name").textContent = name;
    $("space-live").hidden = !s.live;
    $("space").title = s.none ? "Open Stand to make a space" : `${s.space}: snaps go here. Click to pick another space.`;
    $("space").ariaLabel = s.none ? "Make a space in Stand" : `Space: ${s.space}${s.live ? `, ${s.live.names.length} talking` : ""}. Pick another`;
    const who = s.live ? s.live.names.filter(Boolean).join(", ") : "";
    // Writing a note, the bar is the note's top line: the space and Snap. The talk mic
    // and the to-dos step out of the way (one mic, the dictation one, is less confusing).
    // In a call in a browser, the mic is the browser's.
    $("mic").hidden = Boolean(s.none) || Boolean(noting) || Boolean(s.call);
    $("mic").className = s.live ? "mic live" : "mic";
    $("mic").ariaLabel = s.live ? `Join ${who || "them"} in ${s.space}` : `Start talking in ${s.space}`;
    $("mic").title = $("mic").ariaLabel;
    $("mic-on").removeAttribute("hidden");
    $("mic-off").setAttribute("hidden", "");
    $("snap").hidden = false;
    $("snap").title = s.none
      ? `Snap the screen, a window or part of it (${s.snapKey})`
      : s.call
        ? `Snap the screen, a window or part of it, for everyone in the meeting (${s.snapKey})`
        : `Snap the screen, a window or part of it, onto a note for ${s.space} (${s.snapKey})`;
    $("snap").ariaLabel = s.none ? "Snap" : s.call ? "Snap for everyone in the meeting" : `Snap onto a note for ${s.space}`;
    // Snaps pinned to a note that was put away unsaved: the field says they're waiting.
    const pins = s.pins ? `${s.pins} snap${s.pins === 1 ? "" : "s"} pinned` : "";
    $("note-text").textContent = pins ? `${pins}…` : "Write a note…";
    $("note").classList.toggle("pinned", Boolean(pins));
    $("note").title = `Write or say a note for ${s.space} (${s.noteKey}, from any app)`;
    $("note").ariaLabel = pins ? `${pins}: add a note for ${s.space} and save` : `Write a note for ${s.space}`;
    const todos = s.todos ?? [];
    $("todos").hidden = todos.length === 0 || Boolean(noting);
    $("todo-count").textContent = todos.length;
    $("todos").ariaLabel = `${todos.length} to-do${todos.length === 1 ? "" : "s"} in ${s.space}`;
    if (listOpen) todos.length ? void showList(true) : void showList(false);
  }

  // ---- the space's to-dos ----
  let listOpen = false;
  let closing;
  function renderList() {
    $("list-space").textContent = `To-dos in ${state?.space ?? "this space"}`;
    const rows = $("rows");
    const scroll = rows.scrollTop;
    // Rebuilt on every update: the keyboard stays on the same row and button.
    const had = rows.contains(document.activeElement) ? document.activeElement : null;
    const focusId = had?.closest(".todo")?.dataset.id;
    const focusKind = had?.classList.contains("plain") ? "plain" : "copy";
    rows.replaceChildren(
      ...(state?.todos ?? []).map((t) => {
        const li = document.createElement("li");
        li.className = copied.has(t.id) ? "todo copied" : "todo";
        li.dataset.id = t.id;
        li.title = t.text;
        // Real buttons, so the keyboard and VoiceOver can copy too.
        const copy = document.createElement("button");
        copy.className = "copy";
        copy.ariaLabel = `Copy for your agent: ${t.text}`;
        const text = document.createElement("span");
        text.className = "t";
        text.textContent = t.text;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = copied.has(t.id) ? "✓ Copied" : [t.owner, t.itemKey].filter(Boolean).join(" · ");
        copy.append(text, meta);
        const plain = document.createElement("button");
        plain.className = "plain";
        plain.textContent = "Text only";
        plain.title = "Copy just the to-do's words";
        plain.ariaLabel = `Copy just the words: ${t.text}`;
        li.append(copy, plain);
        return li;
      }),
    );
    rows.scrollTop = scroll;
    if (focusId) rows.querySelector(`[data-id="${CSS.escape(focusId)}"] .${focusKind}`)?.focus();
  }
  async function showList(open) {
    listOpen = open;
    $("todos").setAttribute("aria-expanded", String(open));
    clearTimeout(closing);
    $("list").hidden = !open;
    $("todos").classList.toggle("on", open);
    if (!open) {
      await window.bar.size(0);
      document.body.classList.remove("up");
      return;
    }
    renderList();
    const extra = $("list").offsetHeight + 8;
    // Near the bottom of the screen it opens upward. Lay that out before the window grows,
    // so the bar itself stays put.
    document.body.classList.toggle("up", Boolean(await window.bar.size(extra, true)));
    await window.bar.size(extra);
  }
  const copied = new Map();
  async function copyRow(row, plain) {
    const id = row.dataset.id;
    if (!(await window.bar.copy(id, plain))) return;
    clearTimeout(copied.get(id));
    copied.set(id, setTimeout(() => (copied.delete(id), listOpen && renderList()), 1600));
    renderList();
    $("said").textContent = plain ? "Copied the to-do's words." : "Copied the to-do for your agent.";
  }
  $("rows").addEventListener("pointerdown", (e) => {
    const row = e.target.closest(".todo");
    if (!row || e.button !== 0) return;
    e.preventDefault();
    window.bar.press("list");
    void copyRow(row, Boolean(e.target.closest(".plain")));
  });
  // The keyboard and VoiceOver click without a pointer.
  $("rows").addEventListener("click", (e) => {
    const row = e.target.closest(".todo");
    if (!row || e.detail !== 0) return;
    void copyRow(row, Boolean(e.target.closest(".plain")));
  });
  const toggleList = () => {
    void showList(!listOpen);
  };
  $("todos").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    window.bar.press("list");
    toggleList();
  });
  $("todos").addEventListener("click", (e) => e.detail === 0 && toggleList());
  // The note card open under (or over) the bar: the two are drawn as one piece.
  window.bar.onNote((o) => {
    noting = o;
    document.body.classList.toggle("noting", Boolean(o));
    document.body.classList.toggle("noting-up", Boolean(o?.above));
    if (state?.rest) renderRest();
  });
  window.bar.onCloseList(() => {
    listOpen = false;
    $("todos").setAttribute("aria-expanded", "false");
    $("list").hidden = true;
    $("todos").classList.remove("on");
    document.body.classList.remove("up");
  });
  // Off to paste it somewhere: the list folds away a moment after the pointer leaves.
  document.documentElement.addEventListener("mouseleave", () => {
    if (listOpen) closing = setTimeout(() => void showList(false), 1500);
  });
  document.documentElement.addEventListener("mouseenter", () => clearTimeout(closing));

  window.bar.onState((s) => {
    state = s;
    if (s?.micOn) mutedTalk = false;
    else {
      $("pill").classList.remove("voice");
      $("pill").style.setProperty("--v", 0);
    }
    render();
  });

  // ---- your voice ----
  // The ring follows your mic while you talk. Talk while muted (loud for a moment, so a cough
  // doesn't count) and the bar turns amber and says "You're muted" until a while after you stop.
  let loudSince = 0;
  let quiet;
  window.bar.onLevel((v) => {
    const pill = $("pill");
    const on = Boolean(state?.micOn);
    pill.classList.toggle("voice", on);
    pill.style.setProperty("--v", on ? v : 0);
    if (on) return;
    if (v < 0.45) {
      loudSince = 0;
      return;
    }
    loudSince ||= Date.now();
    if (Date.now() - loudSince < 400) return;
    clearTimeout(quiet);
    quiet = setTimeout(() => {
      mutedTalk = false;
      render();
    }, 2500);
    if (!mutedTalk) {
      mutedTalk = true;
      render();
    }
  });
  // How the snap went, in place of the title for a few seconds.
  window.bar.onReport((r) => {
    clearTimeout(saying?.timer);
    const ok = Boolean(r.snapId) || r.title === "Snapped" || r.pending;
    saying = {
      ok,
      pending: Boolean(r.pending),
      text: r.pending ? r.title : r.snapId ? "✓ Snapped for everyone" : ok ? "✓ Snapped to your clipboard" : r.title,
      body: r.body,
      settings: r.settings,
      // Saving waits for its result, but not forever.
      timer: setTimeout(() => {
        saying = null;
        render();
        if (owed) $("said").textContent = owed;
        owed = "";
      }, r.pending ? 100_000 : ok ? 3500 : 6000),
    };
    render();
    // Read out by VoiceOver, which doesn't follow the text that changes in place.
    $("said").textContent = `${saying.text}. ${r.body ?? ""}`;
  });
  // Coming up: the pill waits, unseen, until the app has made the window visible, then
  // arrives, so none of the arrival is spent out of sight.
  let pulseNext = false;
  window.bar.onShown(({ pulse }) => {
    up();
    pulseNext = pulse;
    const pill = $("pill");
    pill.classList.remove("arrive", "first");
    pill.classList.add("waiting");
    requestAnimationFrame(() => requestAnimationFrame(() => (window.bar.painted ? window.bar.painted() : arrive())));
  });
  function arrive() {
    const pill = $("pill");
    // Once per showing: a second "visible" doesn't start it over.
    if (!pill.classList.contains("waiting")) return;
    pill.classList.remove("waiting", "arrive", "first");
    void pill.offsetWidth; // restarts the animation
    pill.classList.add("arrive");
    if (pulseNext) pill.classList.add("first");
  }
  window.bar.onVisible?.(arrive);
  addEventListener("blur", () => up());
  // On press, not on click: a press on the bar can bring Stand forward, which used to hide
  // the bar before the click finished, so the click was lost. A click with no pointer behind
  // it (the keyboard, VoiceOver) still works.
  // `button` can be a function, for a button that does something else out of a meeting.
  function press(el, button) {
    const which = () => (typeof button === "function" ? button() : button);
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      window.bar.press(which());
    });
    el.addEventListener("click", (e) => e.detail === 0 && window.bar.press(which()));
  }
  for (const button of ["open", "snap"]) press($(button), button);
  // In a meeting the mic mutes; out of one it starts talking in the space (or joins whoever is).
  press($("mic"), () => (state?.rest ? "talk" : "mic"));
  press($("space"), "spaces");
  press($("note"), "note");
  // Presses are taken over on pointerdown, so :active never applies: the give is set by hand.
  const up = () => document.querySelectorAll("button.down").forEach((b) => b.classList.remove("down"));
  document.addEventListener("pointerdown", (e) => e.button === 0 && e.target.closest?.("button")?.classList.add("down"), true);
  for (const end of ["pointerup", "pointercancel"]) document.addEventListener(end, up, true);
  document.documentElement.addEventListener("mouseleave", up);
  // Right-click: open Stand, or put the bar away (until the meeting ends, in one).
  addEventListener("contextmenu", (e) => {
    e.preventDefault();
    window.bar.press("menu");
  });
  // So the app knows which app you're in before a click on the bar can change that.
  document.documentElement.addEventListener("mouseenter", () => window.bar.press("hover"));
  document.documentElement.addEventListener("mouseleave", () => window.bar.press("leave"));
</script>
</body>
</html>
